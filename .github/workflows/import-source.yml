name: Publish verified CloudDesk source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack the verified source archive
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          archive = Path('CloudDesk_source.zip')
          expected = '618a093ce3ae96c13b708045e01e76910780e9c91b63983c00da7cb9af1ff4a6'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          assert not Path('pom.xml').exists(), 'Application source is already present'
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  parts = PurePosixPath(entry.filename).parts
                  assert parts[0] == 'clouddesk' and '..' not in parts
                  if entry.is_dir() or len(parts) < 2 or parts[1] == '.github':
                      continue
                  assert not any(p in ('.git', 'target', 'data', '.env') for p in parts)
                  dest = Path(*parts[1:])
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(source.read(entry))
          Path('mvnw').chmod(0o755)
      - name: Apply reviewed timestamp fix and documentation
        shell: python
        run: |
          import base64
          from pathlib import Path
          updates = {"src/main/java/dev/olsa777/clouddesk/request/ResourceRequest.java": "", "src/test/java/dev/olsa777/clouddesk/request/RequestTimestampPersistenceTest.java": "", "README.md": "", ".github/workflows/ci.yml": ""}
          for name, data in updates.items():
              dest = Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(data))
      - name: Build and test on Java 17
        run: ./mvnw --batch-mode verify
      - name: Refresh downloadable source archive
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          base = Path('.')
          files = [Path(x) for x in ['.gitignore', 'README.md', 'pom.xml', 'mvnw', 'mvnw.cmd', 'CloudDesk_preview.jpg', '.github/workflows/ci.yml']]
          for directory in ['.mvn', 'src', 'docs']:
              files.extend(p for p in Path(directory).rglob('*') if p.is_file())
          with zipfile.ZipFile('CloudDesk_source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(files):
                  info = zipfile.ZipInfo('clouddesk/' + p.as_posix(), (2026, 10, 23, 0, 0, 0))
                  info.external_attr = (0o100755 if p.name == 'mvnw' else 0o100644) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, p.read_bytes())
          print('Updated archive:', len(files), 'source files')
      - name: Publish source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .mvn README.md docs pom.xml mvnw mvnw.cmd src CloudDesk_source.zip
          git commit -m 'Add CloudDesk application source and tests'
          git push origin HEAD:main
